# 16stream4model — 16 x 1280x720 @ 30 fps H.264 RTSP streams, 4 models (3 detectors + 1 pose).
#
#   streams 0-3   -> model 0      streams 8-11  -> model 2
#   streams 4-7   -> model 1      streams 12-15 -> model 3
#
# Set stream<i>_rtsp to the RTSP URL of Insight source src<i+1> (scripts/start_sources.sh assigns
# those sources), and insight_host to the Insight host's IP as seen from the DevKit. The app refuses
# to start while any <...> placeholder is left.
# stream<i>_model may be omitted: it defaults to i / 4.

# --- models ---
# model<m>_classes must be the real class count (archives bake a generic 80-class stub).
# model<m>_decode follows the archive HEAD SHAPE: zoo YOLO11/YOLOv8 = yolov8 (raw DFL),
# YOLO26 = yolo26. model<m>_task=pose selects YoloV26Pose and pose-estimation metadata.

# streams 0-3: YOLO26n detection, INT8 (SDK 2.1.3 models/modalix/yolo26-detection)
model0_name=yolo26n_det
model0_archive=./assets/models/yolo26n-det-int8-b1.tar.gz
model0_labels=./assets/labels/coco_label.txt
model0_classes=80
model0_task=detection
model0_decode=yolo26

# streams 4-7: YOLO11n detection (model zoo yolo_11n)
model1_name=yolo11n_det
model1_archive=./assets/models/yolo_11n_mpk.tar.gz
model1_labels=./assets/labels/coco_label.txt
model1_classes=80
model1_task=detection
model1_decode=yolov8

# streams 8-11: YOLOv8n detection (model zoo yolo_v8n)
model2_name=yolov8n_det
model2_archive=./assets/models/yolo_v8n_mpk.tar.gz
model2_labels=./assets/labels/coco_label.txt
model2_classes=80
model2_task=detection
model2_decode=yolov8

# streams 12-15: YOLO26n pose (model zoo yolo_26n_pose), 1 class + 17 kpts.
model3_name=yolo26n_pose
model3_archive=./assets/models/yolo_26n_pose_mpk.tar.gz
model3_labels=./assets/labels/person.txt
model3_classes=1
model3_task=pose
# The zoo yolo_26n_pose score head is already sigmoided and BoxDecode applies a second one.
# Without this every anchor scores ~0.5 (22-29 "poses" per frame on single-person clips).
model3_score_is_prob=true

# --- streams ---
stream0_rtsp=<rtsp-url-1>
stream0_model=0
stream1_rtsp=<rtsp-url-2>
stream1_model=0
stream2_rtsp=<rtsp-url-3>
stream2_model=0
stream3_rtsp=<rtsp-url-4>
stream3_model=0
stream4_rtsp=<rtsp-url-5>
stream4_model=1
stream5_rtsp=<rtsp-url-6>
stream5_model=1
stream6_rtsp=<rtsp-url-7>
stream6_model=1
stream7_rtsp=<rtsp-url-8>
stream7_model=1
stream8_rtsp=<rtsp-url-9>
stream8_model=2
stream9_rtsp=<rtsp-url-10>
stream9_model=2
stream10_rtsp=<rtsp-url-11>
stream10_model=2
stream11_rtsp=<rtsp-url-12>
stream11_model=2
stream12_rtsp=<rtsp-url-13>
stream12_model=3
stream13_rtsp=<rtsp-url-14>
stream13_model=3
stream14_rtsp=<rtsp-url-15>
stream14_model=3
stream15_rtsp=<rtsp-url-16>
stream15_model=3

# --- Insight output ---
insight_host=<insight-host-ip>
video_port_base=9000
metadata_port_base=9100
video_enabled=true
visible_streams=-1

# --- source contract: every stream is 1280x720 @ 30 (integer rate, no B-frames) ---
width=1280
height=720
fps=30
rtsp_transport=tcp
latency_ms=100
drop_on_latency=true
skip_rtsp_probe=true

# --- decoder ---
decoder_buffers=8
decoder_input_buffers=2
decoder_tuning=throughput-low-latency

# --- inference (per model graph: 4 streams fan into one detector) ---
queue_depth=16
internal_queue_depth=1
inference_async=true
max_inflight_per_stream=2
max_inflight_total=8
detections_drop=false
min_score=0.30
nms_iou=0.60
max_detections=50

# --- runtime ---
warmup_frames=30
report_interval=5
duration=0
target_ratio=0.97
stall_warn_s=3
verbose=false
print_backend=false
