# quad-stream-quad-model — 4 RTSP streams -> 4 DIFFERENT models -> 4 UDP sinks.
# Each slot is a separate RTSP connection and a separate H.264 decode.

# Fallback used by any slot that does not set its own stream<i>_rtsp below.
rtsp_default=<rtsp-url>
rtsp_transport=tcp

# How many stream slots to run (1..4 use the built-in defaults; drop to 2 to
# land a lighter, higher-FPS pipeline — see README.md / LEARNING.md).
num_streams=4

# --- per-stream RTSP source (slot i) ---
# All four are the same URL for now; replace individually for distinct cameras.
stream0_rtsp=<rtsp-url>
stream1_rtsp=<rtsp-url>
stream2_rtsp=<rtsp-url>
stream3_rtsp=<rtsp-url>

# --- per-stream routing (slot i). task in: detection|segmentation|pose|yolox ---
# task also selects the on-device decode family (main.py DECODE_FAMILY); nothing decodes on the host.
stream0_task=detection
stream1_task=segmentation
stream2_task=pose
stream3_task=yolox

# Model archives. Streams 0/1 are model-zoo; 2/3 are not published and are built by
# ../../model-compilation (see README).
stream0_model=./assets/models/yolo_11s_mpk.tar.gz
stream1_model=./assets/models/yolo_11s_seg_mpk.tar.gz
stream2_model=./assets/models/yolo26s-pose.compile_ready_mpk.tar.gz
stream3_model=./assets/models/yolox_s.compile_ready_mpk.tar.gz


# Host/IP that receives the annotated H.264/RTP UDP output streams.
udp_host=<host-ip>
# Stream i publishes on udp_port_base + i*udp_port_stride unless stream<i>_port is set.
udp_port_base=9000
udp_port_stride=1

# Model input geometry (all four archives are 640x640).
model_width=640
model_height=640

# Fallbacks used when RTSP caps are incomplete.
width=1280
height=720
fps=60

# RTSP receiver jitter buffer (ms).
latency_ms=200

# --- decoder admission ---
# All four decoders share ONE graph/Run so admission is requested at all (Neat skips it for a
# single decoder). Worth 152 -> 235 fps aggregate. Debug: SIMA_DECODER_ADMISSION_DEBUG=1.
decoder_buffers=16
# Per-stream compressed-INPUT pool.
decoder_input_buffers=2
# One of: auto | default | low-memory | throughput-low-latency
decoder_tuning=auto
# Let rtspsrc drop late buffers. Correct for a live source.
drop_on_latency=true

# Pin parser caps from fallback_*. LEAVE FALSE for a 59.94 fps source: it pins an integer
# framerate and 60/1 vs 60000/1001 fails negotiation ("not-negotiated (-4)", 0.0 fps).
skip_rtsp_probe=false

# Detection thresholds. These are passed into the ON-DEVICE BoxDecode stage
# (ModelOptions.score_threshold / nms_iou_threshold / top_k), so the NMS runs on the
# accelerator -- the host never sees a sub-threshold box.
score_threshold=0.25
nms_iou=0.50
top_k=100

# Source/video graph queue depth (Realtime preset, KeepLatest overflow).
queue_depth=3

# Frames the MODEL graph may hold in flight. This is the real backpressure -- OverflowPolicy::Block
# does NOT bound in-graph buffering (segmentation once reached ~600 frames / 11 s of latency while
# still reporting 59 fps). Raise for MLA overlap, lower for latency.
model_queue_depth=4

# Frames parked between the puller and the output thread (postproc + overlay + encode).
# Each parked frame holds a ZeroCopy model output buffer, so keep this small.
output_queue_depth=2

# Seconds between live time-profile prints. 0 = only print the summary at exit.
profile_interval=5

# Where the model's pre/post CVU stages run: AUTO | EV74 | A65.
# Pin to EV74 -- AUTO does not reliably pick the accelerator (76.7 vs 86.5 fps aggregate).
cvu_pre_target=EV74
cvu_post_target=EV74

# H.264 output encoder bitrate (kbps).
bitrate_kbps=4000

# Frames PER stream; 0 = run until interrupted.
frames=0

# Print generated backend pipelines when true.
print_backend=false
