# detection-vlm-assistant runtime config (key=value, '#' comments).
# The main values can also be set on the command line; run `dk ./main.py --help` for the flags.

# ------------------------------------------------------------------ input ---
# source: rtsp (always-on camera demo) or image (still image / dir / glob).
source=rtsp

# RTSP H.264 input stream (source=rtsp).
rtsp_url=<rtsp-url>
# tcp for reliability or udp for lower latency.
rtsp_transport=tcp
# RTSP receiver jitter buffer in milliseconds.
latency_ms=200
# Frame size and rate of the RTSP stream. Read from the stream at start; this is the fallback.
width=1280
height=720
fps=30

# true: read width/height/fps from the stream at start; false: use the values above.
probe_source=true

# Still image(s) for source=image: a file, a directory, or a glob.
# image_path=../../tutorial/assets/images/image.png

# --------------------------------------------------------------- detector ---
# YOLO11n from the SiMa Model Zoo (see README "Model Download").
model_path=./assets/models/yolo_11n_mpk.tar.gz
# Decode family: yolov8 | yolo11 => BoxDecodeType.YoloV8 (with NMS) ; yolo26 => YoloV26.
model_name=yolo11
# Box-decode controls.
score_threshold=0.25
nms_iou=0.50
top_k=100
# Frames to process; 0 = run until interrupted (rtsp) / process all images.
frames=0
# Wall-clock limit in seconds; 0 = no limit. Also settable as --duration.
duration_s=0
# Detector pull timeout in milliseconds.
timeout_ms=20000

# --- rtsp resilience ---
# One empty pull is NOT end-of-stream; only rtsp_stall_timeout_s of continuous silence is.
source_timeout_ms=2000
rtsp_stall_timeout_s=15.0
rtsp_reconnect_attempts=3

# --- video out ---
# Boxes are white; the one the VLM would caption is red. Empty udp_host = no video (stdout only).
video_enabled=true
# Host (viewer machine) that receives the UDP video.
udp_host=<host-ip>
# UDP base port for the H.264/RTP stream (also settable as udp_port_base).
udp_port=9000
# H.264 encoder bitrate in kbps.
bitrate_kbps=4000

# --- vlm ---
# vlm_enabled=false, a missing model dir, or --no-vlm all fall back to DRY-RUN (logs the prompt).
vlm_enabled=true
# Deployed VLM directory on the board (`llima pull <model-id>`; see README "Model Download").
# Used only in real (non-dry-run) mode; if it is missing the app falls back to dry-run.
vlm_model_dir=/media/nvme/llima/models/Qwen3-VL-4B-Instruct-Autoround-a16w4

# Trigger gating: which detections deserve an (expensive) VLM call.
# Comma-separated COCO class allow-list (empty = any class).
vlm_trigger_classes=car
# Minimum detection confidence to trigger.
vlm_trigger_min_score=0.55
# Crop must cover at least this fraction of the frame (skip tiny/far objects).
vlm_trigger_min_area_frac=0.02

# Rate limit: minimum seconds between VLM calls (the VLM cannot run per frame).
vlm_interval_seconds=5.0
# Bounded in-flight/queued crops. Full queue => drop trigger (backpressure).
vlm_max_pending=1

# Dedup: treat a box as the same object if IoU >= vlm_dedup_iou; a given object can
# re-trigger only after vlm_dedup_cooldown_s. Stops one object re-firing every frame.
vlm_dedup_iou=0.6
vlm_dedup_cooldown_s=15.0

# Generation controls.
vlm_max_new_tokens=96
# Prompt template; {label} is substituted with the detected class (lower-case).
vlm_prompt=You are watching a security camera. This image is a crop of one detected {label}. Describe this {label} and anything notable about it in one short sentence.
