# USB camera -> YOLO26m object detection -> H.264 RTP/UDP
#
# Every value below is read by both main.cpp and main.py.

# ── Camera ────────────────────────────────────────────────────────────────────

# The capture node. MOST /dev/video* on Modalix are ISP/codec devices, not cameras.
# Find the real one: v4l2-ctl -d <dev> --list-formats must report MJPG.
camera_device=/dev/video96

# Capture resolution. 1920x1080 is the Brio 100's maximum.
width=1920
height=1080

# Capture rate. The camera sustains a true 30 fps at 1080p in MJPEG.
# Do not switch the source to raw YUYV: the camera only offers 5 fps for 1080p YUYV
# because uncompressed 4:2:2 does not fit in USB 2.0 bandwidth.
fps=30

# Correct an upside-down camera mount before inference. COCO models lose confidence
# on inverted scenes. One of: none | rotate-180 | horizontal-flip | vertical-flip
flip=none

# --- Model --- prefer bf16: the pipeline is camera-limited at 30 fps so int8 buys ~0 fps,
# and int8 CAPS EVERY CONFIDENCE SCORE AT 0.50 (halve score_threshold if you switch).
model_path=./assets/models/yolo26m-det-bf16-mla_tess-b1.tar.gz
#model_path=./assets/models/yolo26m-det-int8-b1.tar.gz

# Model input size. yolo26m is compiled for 640x640; changing this requires recompiling.
model_width=640
model_height=640

# Minimum detection confidence. bf16: 0.30. int8: ~0.15 (its scores cap at 0.50).
score_threshold=0.30

# NMS IoU threshold. Ignored by this model: YOLO26 heads are NMS-free and the YoloV26
# decoder runs no NMS. Kept for other decode types.
nms_iou=0.50

# Maximum detections returned per frame.
top_k=100

# COCO class count for the stock model.
num_classes=80

# ── Output ────────────────────────────────────────────────────────────────────

# Host that receives the H.264 RTP/UDP video stream. REQUIRED.
# Set this to the IP of the machine you want to watch the stream on.
udp_host=<host-ip>
# UDP port for the H.264 video stream.
udp_port=9000

# H.264 encoder bitrate.
bitrate_kbps=4000

# Draw detection boxes onto the streamed video. push mode only (see pipeline_mode).
# Costs ~1.5-4 ms/frame on the CPU. Turn off if Neat Insight draws the boxes (metadata_host).
overlay=true

# Optional: host running Neat Insight. The app then sends each frame's detections as
# `object-detection` JSON and Insight draws the boxes itself (set overlay=false to avoid
# drawing them twice). Leave empty to disable metadata sending.
metadata_host=

# UDP port for detection metadata. Insight pairs video port 9000+N with metadata port
# 9100+N (channel N), so keep the same offset as udp_port.
metadata_port=9100

# ── Pipeline ──────────────────────────────────────────────────────────────────

# push  : camera -> appsrc -> CVU -> MLA -> boxdecode. The appsrc push lands frames in SiMa DMA.
# graph : zero-copy Branch. Needs camera_bridge=true and a runtime shipping `neatcamerabridge`;
#         without it the CVU reads black frames and returns ZERO detections.
pipeline_mode=push

# Append `neatcamerabridge` to the source fragment. Requires a runtime that has it;
# enabling it on one that does not fails with `no element "neatcamerabridge"`.
camera_bridge=false

# Frames to process; 0 runs until Ctrl-C.
frames=0

# Seconds between time-profile lines. 0 turns the live profile off (the exit summary
# still prints). Every ms figure on the line is the mean over THAT WINDOW, not since
# start -- a cumulative mean hides a pipeline that degrades halfway through a run.
profile_interval=1.0

# Pipeline queue depth. 3 keeps latency low.
queue_depth=3

# Print the generated GStreamer backend pipeline at startup.
print_backend=false

# Dump the MPK contract and planner routing (which stages land on CVU/MLA, what fuses into
# boxdecode). Verbose; look for `session-route:` lines.
verbose_planner=false

# Diagnostic: replace the camera with a GStreamer fragment ending in NV12 at width x height.
# Use it to separate "model wrong" from "nothing to detect". Empty = real camera. Example:
#   source_override=multifilesrc location=../../model-compilation/assets/calibration/000000000139.jpg loop=true caps=image/jpeg,framerate=30/1 ! jpegparse ! jpegdec ! videoscale ! videoconvert ! video/x-raw,format=NV12,width=1920,height=1080,framerate=30/1 ! queue
source_override=
