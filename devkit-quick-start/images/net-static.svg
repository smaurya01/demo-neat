<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="760" height="330" fill="#f6f8fa" rx="8"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">Option C — direct cable, static IPs</text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#57606a">Deterministic addresses. No DHCP, and by default no internet on the board.</text>

  <rect x="70" y="86" width="240" height="106" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="190" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#0a3069">Host PC</text>
  <text x="190" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#0969da">192.168.1.10/24</text>
  <text x="190" y="158" text-anchor="middle" font-size="11" fill="#0a3069">set manually</text>
  <text x="190" y="178" text-anchor="middle" font-size="11" fill="#0a3069">same subnet, different host</text>

  <rect x="450" y="86" width="240" height="106" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="570" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#0f5323">Modalix DevKit</text>
  <text x="570" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#1a7f37">192.168.1.20/24</text>
  <text x="570" y="158" text-anchor="middle" font-size="11" fill="#0f5323">sima-cli network</text>
  <text x="570" y="178" text-anchor="middle" font-size="11" fill="#0f5323">or NetworkManager</text>

  <line x1="310" y1="139" x2="450" y2="139" stroke="#1a7f37" stroke-width="3"/>
  <text x="380" y="129" text-anchor="middle" font-size="10" font-weight="700" fill="#0f5323">RJ45 direct</text>

  <rect x="40" y="212" width="680" height="98" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="1.5"/>
  <text x="60" y="236" font-size="13" font-weight="700" fill="#cf222e">Set both sides — this is the usual mistake</text>
  <text x="60" y="258" font-size="11.5" fill="#57606a">Changing only the host is not enough. The board keeps its old config and the two never meet.</text>
  <text x="60" y="284" font-size="11.5" fill="#57606a">No internet on the board this way unless you add NAT on the host. Package installs and updates will fail.</text>
</svg>
