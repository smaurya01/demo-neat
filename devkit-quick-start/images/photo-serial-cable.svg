<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="760" height="240" fill="#f6f8fa" rx="8" stroke="#d0d7de" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="380" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#9a6700">PHOTO NEEDED</text>
  <text x="380" y="96" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">Serial console cable</text>
  <text x="380" y="132" text-anchor="middle" font-size="13" fill="#57606a">USB-C end in the DevKit's UART port,</text>
  <text x="380" y="156" text-anchor="middle" font-size="13" fill="#57606a">USB-A end in the host PC.</text>
  <text x="380" y="200" text-anchor="middle" font-size="11.5" fill="#8c959f">Replace this file with a real photograph at images/photo-serial-cable.jpg</text>
  <text x="380" y="218" text-anchor="middle" font-size="11.5" fill="#8c959f">and update the image link in the chapter.</text>
</svg>
