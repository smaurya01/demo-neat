<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="760" height="330" fill="#f6f8fa" rx="8"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">Option B — board on your LAN via a router</text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#57606a">The default. Board and host are peers on the same network.</text>

  <rect x="290" y="76" width="180" height="70" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="380" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#633c01">Router / switch</text>
  <text x="380" y="124" text-anchor="middle" font-size="11" fill="#633c01">DHCP server + internet</text>

  <rect x="60" y="190" width="200" height="96" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="160" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#0a3069">Host PC</text>
  <text x="160" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#0969da">192.168.1.10</text>
  <text x="160" y="260" text-anchor="middle" font-size="11" fill="#0a3069">Wi-Fi or wired</text>

  <rect x="500" y="190" width="200" height="96" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="600" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#0f5323">Modalix DevKit</text>
  <text x="600" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#1a7f37">192.168.1.x (DHCP)</text>
  <text x="600" y="260" text-anchor="middle" font-size="11" fill="#0f5323">modalix.local</text>

  <line x1="340" y1="146" x2="180" y2="190" stroke="#0969da" stroke-width="2.5"/>
  <line x1="420" y1="146" x2="580" y2="190" stroke="#1a7f37" stroke-width="3"/>
  <text x="500" y="160" text-anchor="middle" font-size="10" font-weight="700" fill="#0f5323">RJ45</text>

  <rect x="40" y="300" width="680" height="1" fill="none"/>
  <text x="380" y="316" text-anchor="middle" font-size="11.5" fill="#57606a">Best default: the board gets real internet, and anyone on the LAN can reach it. Nothing to configure on the board.</text>
</svg>
