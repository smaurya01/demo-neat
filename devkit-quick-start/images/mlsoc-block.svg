<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="760" height="430" fill="#f6f8fa" rx="8"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">MLSoC Modalix — functional blocks</text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#57606a">One chip: CPU, ML accelerator, ISP, vision unit and codecs on a shared Network-on-Chip</text>

  <!-- accelerator row -->
  <rect x="30" y="75" width="160" height="86" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="110" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#0a3069">MLA</text>
  <text x="110" y="122" text-anchor="middle" font-size="11" fill="#0a3069">ML Accelerator</text>
  <text x="110" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#0969da">50 TOPS INT8</text>

  <rect x="205" y="75" width="160" height="86" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="285" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#0f5323">CVU</text>
  <text x="285" y="122" text-anchor="middle" font-size="11" fill="#0f5323">Synopsys ARC EV74</text>
  <text x="285" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1a7f37">750 GOPS · 4-core</text>

  <rect x="380" y="75" width="160" height="86" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="460" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#633c01">ISP</text>
  <text x="460" y="122" text-anchor="middle" font-size="11" fill="#633c01">Arm Mali-C71</text>
  <text x="460" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#9a6700">1.2 GHz · camera in</text>

  <rect x="555" y="75" width="175" height="86" rx="6" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <text x="642" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#512a97">Video codecs</text>
  <text x="642" y="122" text-anchor="middle" font-size="11" fill="#512a97">H.264 / H.265 / AV1</text>
  <text x="642" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#8250df">4Kp60 · MJPEG</text>

  <!-- NoC -->
  <rect x="30" y="180" width="700" height="44" rx="6" fill="#eaeef2" stroke="#57606a" stroke-width="1.5"/>
  <text x="380" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">Network-on-Chip (NoC)</text>
  <text x="380" y="216" text-anchor="middle" font-size="11" fill="#57606a">shared interconnect — blocks pass buffers without going through the CPU</text>

  <!-- CPU + memory row -->
  <rect x="30" y="243" width="340" height="86" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="200" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#82071e">Application CPU complex</text>
  <text x="200" y="290" text-anchor="middle" font-size="12" fill="#82071e">8 x Arm Cortex-A65 @ 1.4 GHz</text>
  <text x="200" y="308" text-anchor="middle" font-size="11" fill="#82071e">dual-threaded — 16 logical threads in htop</text>

  <rect x="390" y="243" width="340" height="86" rx="6" fill="#eaeef2" stroke="#57606a" stroke-width="1.5"/>
  <text x="560" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">Memory</text>
  <text x="560" y="290" text-anchor="middle" font-size="12" fill="#1f2328">32 GB LPDDR5 (shared)</text>
  <text x="560" y="308" text-anchor="middle" font-size="11" fill="#57606a">~6 GB Arm cores · 16 GB accelerator</text>

  <!-- footer note -->
  <rect x="30" y="348" width="700" height="54" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="46" y="370" font-size="12" font-weight="700" fill="#1f2328">Why this matters for your code</text>
  <text x="46" y="390" font-size="11.5" fill="#57606a">Neat builds a graph across these blocks. Frames can go camera to ISP to MLA to codec without a CPU copy.</text>
</svg>
