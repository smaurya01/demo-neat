<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="760" height="240" fill="#f6f8fa" rx="8" stroke="#d0d7de" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="380" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#9a6700">PHOTO NEEDED</text>
  <text x="380" y="96" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">Powered on</text>
  <text x="380" y="132" text-anchor="middle" font-size="13" fill="#57606a">Barrel jack seated in the 12 V input,</text>
  <text x="380" y="156" text-anchor="middle" font-size="13" fill="#57606a">with the red power LED clearly visible and lit.</text>
  <text x="380" y="200" text-anchor="middle" font-size="11.5" fill="#8c959f">Replace this file with a real photograph at images/photo-power-on.jpg</text>
