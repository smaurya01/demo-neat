<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="760" height="300" fill="#f6f8fa" rx="8"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">Standalone desktop setup (optional)</text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#57606a">Use the board like a small Linux PC. Everything here is optional — the serial console and SSH both work without it.</text>

  <rect x="60" y="80" width="190" height="110" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <text x="155" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#512a97">Monitor</text>
  <text x="155" y="132" text-anchor="middle" font-size="11.5" fill="#512a97">HDMI 1.4 cable</text>
  <text x="155" y="154" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8250df">4K @ 30 Hz</text>
  <text x="155" y="174" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8250df">or 1080p @ 60 Hz</text>

  <rect x="285" y="80" width="190" height="110" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="380" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#0f5323">Modalix DevKit</text>
  <text x="380" y="132" text-anchor="middle" font-size="11.5" fill="#0f5323">SM768 graphics</text>
  <text x="380" y="156" text-anchor="middle" font-size="11.5" fill="#0f5323">boots to a desktop</text>
  <text x="380" y="176" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a7f37">login: sima / edgeai</text>

  <rect x="510" y="80" width="190" height="110" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="605" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#0a3069">USB keyboard</text>
  <text x="605" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#0a3069">and mouse</text>
  <text x="605" y="156" text-anchor="middle" font-size="11.5" fill="#0a3069">any of the 4 USB 3.0 ports</text>
  <text x="605" y="176" text-anchor="middle" font-size="11.5" fill="#0a3069">no drivers needed</text>

  <line x1="250" y1="135" x2="285" y2="135" stroke="#8250df" stroke-width="3"/>
  <line x1="475" y1="135" x2="510" y2="135" stroke="#0969da" stroke-width="3"/>

  <rect x="60" y="212" width="640" height="70" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="80" y="236" font-size="13" font-weight="700" fill="#1f2328">If the screen stays black</text>
  <text x="80" y="258" font-size="11.5" fill="#57606a">Check the monitor is on the right input, and that the board's red power LED is lit. HDMI is detected at boot —</text>
  <text x="80" y="274" font-size="11.5" fill="#57606a">plug the cable in before powering on, then reboot if you connected it late.</text>
</svg>
